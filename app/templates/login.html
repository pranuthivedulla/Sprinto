<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sprinto cold outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --panel:#0c0c0c; --panel-2:#151515; --line:#2e2e2e;
          --text:#f0f0f0; --dim:#8c8c8c; --dimmer:#5e5e5e;
          --pink:#ff3d85; --pink-dim:#a8265a;
          --mono:"JetBrains Mono","Courier New",ui-monospace,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; padding:24px 16px; color:var(--text);
         background:#000;
         background-image:radial-gradient(90% 70% at 50% 0%, #1a1a1a 0%, #000 60%);
         font:15px/1.6 var(--mono); -webkit-font-smoothing:antialiased; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:5px;
          padding:30px; width:100%; max-width:420px; }
  .mark { display:inline-flex; align-items:center; gap:9px; margin-bottom:22px;
          font-size:11px; letter-spacing:.22em; text-transform:uppercase;
          color:var(--dim); }
  .mark::before { content:""; width:17px; height:17px; background:var(--text);
                  box-shadow:inset 0 0 0 4px #000, inset 0 0 0 9px var(--text); }
  h1 { font-size:26px; font-weight:400; margin:0; line-height:1.05;
       text-transform:uppercase; letter-spacing:-.01em; }
  h1 .fade { display:block; color:var(--dimmer); }
  p { color:var(--dim); font-size:12px; line-height:1.7; margin:16px 0 22px; }
  label { display:block; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
          color:var(--dim); margin:0 0 6px; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:0;
          font:inherit; background:#070707; color:var(--text); }
  input:focus { outline:1px solid var(--pink); border-color:var(--pink); }
  button { margin-top:18px; width:100%; padding:12px; border:1px solid var(--text);
           border-radius:0; background:var(--text); color:#000; font:inherit;
           font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
           cursor:pointer; }
  button:hover { background:#fff; border-color:#fff; }
  button:focus-visible { outline:2px solid var(--pink); outline-offset:2px; }
  .note { background:var(--panel-2); border:1px solid var(--pink-dim); border-radius:5px;
          padding:11px 13px; font-size:12px; margin:0 0 18px; color:var(--text); }
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="mark">Sprinto</div>
  <h1>Cold outreach<span class="fade">domain to reply</span></h1>
  <p>This page lists real people's names and work email addresses, so it stays closed.</p>
  {% if error %}<div class="note">{{ error }}</div>{% endif %}
  <label for="passcode">Passcode</label>
  <input type="password" id="passcode" name="passcode" autocomplete="current-password"
         autofocus>
  <button type="submit">Open the review page</button>
</form>
</body>
</html>
