<text x="129" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Actor</text>
<text x="368" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Trigger</text>
<text x="640" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Input</text>
<line x1="504" y1="86" x2="504" y2="132" stroke="#2c4madd" stroke-width="1"/>
<text x="912" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Research</text>
<line x1="776" y1="86" x2="776" y2="132" stroke="#2c4madd" stroke-width="1"/>
<text x="1184" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Qualify</text>
<line x1="1048" y1="86" x2="1048" y2="132" stroke="#2c4madd" stroke-width="1"/>
<text x="1456" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Draft</text>
<line x1="1320" y1="86" x2="1320" y2="132" stroke="#2c4madd" stroke-width="1"/>
<text x="1728" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Review and send</text>
<line x1="1592" y1="86" x2="1592" y2="132" stroke="#2c4madd" stroke-width="1"/>
<text x="2000" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Reply and meeting</text>
<line x1="1864" y1="86" x2="1864" y2="132" stroke="#2c4madd" stroke-width="1"/>
<rect x="246" y="187" width="244" height="58" rx="9" fill="#efe6ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="368" y="208" text-anchor="middle" font-size="13" fill="#15233a">Types domains, or clicks</text>
<text x="368" y="225" text-anchor="middle" font-size="13" fill="#15233a">Healthtech, Fintech or Devtools</text>
<rect x="246" y="370" width="244" height="75" rx="9" fill="#fdefc8" stroke="#e0a21a" stroke-width="2"/>
<text x="368" y="390" text-anchor="middle" font-size="13" fill="#15233a">A script posts JSON to /run-</text>
<text x="368" y="408" text-anchor="middle" font-size="13" fill="#15233a">domain. Same endpoint, same</text>
<text x="368" y="424" text-anchor="middle" font-size="13" fill="#15233a">answers</text>
<rect x="518" y="370" width="244" height="75" rx="9" fill="#fdefc8" stroke="#e0a21a" stroke-width="2"/>
<text x="640" y="390" text-anchor="middle" font-size="13" fill="#15233a">1 Cleans each one. 253 characters,</text>
<text x="640" y="408" text-anchor="middle" font-size="13" fill="#15233a">63 a label, punycode for other</text>
<text x="640" y="424" text-anchor="middle" font-size="13" fill="#15233a">scripts. One domain per request</text>
<rect x="790" y="370" width="244" height="75" rx="9" fill="#fdefc8" stroke="#e0a21a" stroke-width="2"/>
<text x="912" y="390" text-anchor="middle" font-size="13" fill="#15233a">2 Reads home, pricing, about,</text>
<text x="912" y="408" text-anchor="middle" font-size="13" fill="#15233a">careers, trust, customers. Dates</text>
<text x="912" y="424" text-anchor="middle" font-size="13" fill="#15233a">every headline itself</text>
<rect x="1062" y="370" width="244" height="75" rx="9" fill="#fdefc8" stroke="#e0a21a" stroke-width="2"/>
<text x="1184" y="390" text-anchor="middle" font-size="13" fill="#15233a">4 Five hard filters, then the</text>
<text x="1184" y="408" text-anchor="middle" font-size="13" fill="#15233a">tier. A drop carries the rule and</text>
<text x="1184" y="424" text-anchor="middle" font-size="13" fill="#15233a">the sentence that fired it</text>
<rect x="1334" y="370" width="244" height="75" rx="9" fill="#fdefc8" stroke="#e0a21a" stroke-width="2"/>
<text x="1456" y="390" text-anchor="middle" font-size="13" fill="#15233a">6 Re-reads the draft against the</text>
<text x="1456" y="408" text-anchor="middle" font-size="13" fill="#15233a">stored signals and flags any claim</text>
<text x="1456" y="424" text-anchor="middle" font-size="13" fill="#15233a">they do not carry</text>
<rect x="1606" y="370" width="244" height="75" rx="9" fill="#fbd9e8" stroke="#d94f8c" stroke-width="2"/>
<text x="1728" y="390" text-anchor="middle" font-size="13" fill="#15233a">7 One card per company: funnel,</text>
<text x="1728" y="408" text-anchor="middle" font-size="13" fill="#15233a">tabs, flags, evidence. Daily cap</text>
<text x="1728" y="424" text-anchor="middle" font-size="13" fill="#15233a">of 15</text>
<rect x="1878" y="370" width="244" height="75" rx="9" fill="#fdefc8" stroke="#e0a21a" stroke-width="2"/>
<text x="2000" y="390" text-anchor="middle" font-size="13" fill="#15233a">9 Matches each reply to its</text>
<text x="2000" y="408" text-anchor="middle" font-size="13" fill="#15233a">company by Message-ID, then by the</text>
<text x="2000" y="424" text-anchor="middle" font-size="13" fill="#15233a">whole subject</text>
<rect x="1062" y="542" width="244" height="75" rx="9" fill="#cdf3ea" stroke="#19a98c" stroke-width="2"/>
<text x="1184" y="564" text-anchor="middle" font-size="13" fill="#15233a">5 One contact: name, title, email.</text>
<text x="1184" y="580" text-anchor="middle" font-size="13" fill="#15233a">Cached, so a domain is never</text>
<text x="1184" y="598" text-anchor="middle" font-size="13" fill="#15233a">searched twice</text>
<rect x="790" y="696" width="244" height="75" rx="9" fill="#d5f5dd" stroke="#2fa75a" stroke-width="2"/>
<text x="912" y="718" text-anchor="middle" font-size="13" fill="#15233a">3 Pulls each field with a quote,</text>
<text x="912" y="734" text-anchor="middle" font-size="13" fill="#15233a">re-checked word for word against</text>
<text x="912" y="752" text-anchor="middle" font-size="13" fill="#15233a">the page</text>
<rect x="1334" y="705" width="244" height="58" rx="9" fill="#d5f5dd" stroke="#2fa75a" stroke-width="2"/>
<text x="1456" y="726" text-anchor="middle" font-size="13" fill="#15233a">6 Two pain points for that role,</text>
<text x="1456" y="743" text-anchor="middle" font-size="13" fill="#15233a">then the email</text>
<rect x="1878" y="696" width="244" height="75" rx="9" fill="#d5f5dd" stroke="#2fa75a" stroke-width="2"/>
<text x="2000" y="718" text-anchor="middle" font-size="13" fill="#15233a">10 Reads the reply: interested or</text>
<text x="2000" y="734" text-anchor="middle" font-size="13" fill="#15233a">not. Picks one slot from the list</text>
<text x="2000" y="752" text-anchor="middle" font-size="13" fill="#15233a">code gave it</text>
<rect x="1606" y="860" width="244" height="75" rx="9" fill="#d8e9fb" stroke="#2f7fd0" stroke-width="2"/>
<text x="1728" y="880" text-anchor="middle" font-size="13" fill="#15233a">8 Sends over SMTP, always to</text>
<text x="1728" y="898" text-anchor="middle" font-size="13" fill="#15233a">TO_EMAIL, with the contact named</text>
<text x="1728" y="914" text-anchor="middle" font-size="13" fill="#15233a">in a banner</text>
<rect x="1878" y="868" width="151" height="58" rx="9" fill="#d8e9fb" stroke="#2f7fd0" stroke-width="2"/>
<text x="1954" y="889" text-anchor="middle" font-size="13" fill="#15233a">9 IMAP reads INBOX</text>
<text x="1954" y="906" text-anchor="middle" font-size="13" fill="#15233a">and Spam</text>
<rect x="1606" y="187" width="244" height="58" rx="9" fill="#efe6ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="1728" y="208" text-anchor="middle" font-size="13" fill="#15233a">Reads the card, edits, approves or</text>
<text x="1728" y="225" text-anchor="middle" font-size="13" fill="#15233a">rejects</text>
<rect x="1878" y="196" width="244" height="41" rx="9" fill="#efe6ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="2000" y="216" text-anchor="middle" font-size="13" fill="#15233a">Takes over when the agent gives up</text>
<rect x="1878" y="1010" width="244" height="75" rx="9" fill="#e6e2fb" stroke="#6246c7" stroke-width="2"/>
<text x="2000" y="1030" text-anchor="middle" font-size="13" fill="#15233a">11 check_calendar, propose_time,</text>
<text x="2000" y="1048" text-anchor="middle" font-size="13" fill="#15233a">handle_reply, book_meeting, else</text>
<text x="2000" y="1064" text-anchor="middle" font-size="13" fill="#15233a">escalate</text>
<rect x="246" y="1154" width="1876" height="41" rx="9" fill="#e7edf6" stroke="#5b6b85" stroke-width="2"/>
<text x="1184" y="1174" text-anchor="middle" font-size="13" fill="#15233a">Postgres on Neon deployed, SQLite on your laptop, one layer over both: runs, companies, hunter_cache, news_cache, send_log, login_attempts, decision_log. Every field keeps its quote and its source, which is what the card shows you and what the traceability check reads back.</text>
