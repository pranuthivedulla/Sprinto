<text x="174" y="1274" font-size="12.5" fill="#15233a">The main flow</text>
<line x1="292" y1="1269" x2="334" y2="1269" stroke="#6b7a90" stroke-width="2.4" stroke-dasharray="8 6"/>
<path d="M 334 1263 L 346 1269 L 334 1275 Z" fill="#6b7a90"/>
<text x="354" y="1274" font-size="12.5" fill="#15233a">Dropped, with the reason</text>
<line x1="528" y1="1269" x2="570" y2="1269" stroke="#d94f8c" stroke-width="2.4" stroke-dasharray="8 6"/>
<path d="M 570 1263 L 582 1269 L 570 1275 Z" fill="#d94f8c"/>
<text x="590" y="1274" font-size="12.5" fill="#15233a">Only when it gives up</text>
<rect x="754" y="1260" width="20" height="18" rx="4" fill="#fdefc8" stroke="#e0a21a" stroke-width="2"/>
<text x="782" y="1274" font-size="12.5" fill="#15233a">Plain code decides</text>
<rect x="930" y="1260" width="20" height="18" rx="4" fill="#d5f5dd" stroke="#2fa75a" stroke-width="2"/>
<text x="958" y="1274" font-size="12.5" fill="#15233a">Gemini Flash</text>
<rect x="1066" y="1260" width="20" height="18" rx="4" fill="#cdf3ea" stroke="#19a98c" stroke-width="2"/>
<text x="1094" y="1274" font-size="12.5" fill="#15233a">Hunter.io</text>
<rect x="1186" y="1260" width="20" height="18" rx="4" fill="#d8e9fb" stroke="#2f7fd0" stroke-width="2"/>
<text x="1214" y="1274" font-size="12.5" fill="#15233a">Gmail</text>
<rect x="1286" y="1260" width="20" height="18" rx="4" fill="#e6e2fb" stroke="#6246c7" stroke-width="2"/>
<text x="1314" y="1274" font-size="12.5" fill="#15233a">LangGraph</text>
<rect x="1406" y="1260" width="20" height="18" rx="4" fill="#efe6ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="1434" y="1274" font-size="12.5" fill="#15233a">You</text>
<rect x="1486" y="1260" width="20" height="18" rx="4" fill="#f4f6f9" stroke="#aab6c6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1514" y="1274" font-size="12.5" fill="#15233a">Designed, not built</text>
<text x="26" y="1314" font-size="12.5" fill="#15233a"><tspan font-weight="700">Set once:</tspan> ICP is fintech, healthtech or devtools, 10-100 people, Series A to C. Daily send cap 15, at most 15 domains a run, 240 seconds a domain. Every send goes to TO_EMAIL and nowhere else.</text>
<text x="26" y="1333" font-size="12.5" fill="#15233a"><tspan font-weight="700">Never:</tspan> sends without a human approval, states a fact it did not find, quotes negative news in the email, searches the same domain on Hunter twice, or turns "not shown on the site" into "not certified".</text>
<text x="26" y="1352" font-size="12.5" fill="#15233a"><tspan font-weight="700">Not built:</tspan> discovery (the companies are still your list, not found from the signals) and the feedback loop (your edits are stored and nothing reads them).</text>
</svg>